# CinderPath example configuration.
# Precedence: explicit CLI flags > CINDERPATH_* environment > this file > defaults.
db: cinderpath.db
output_dir: reports
log_level: info
no_color: false
timeout: 2m
profile: safe

# Unified operator workflow. All values are placeholders. Mock is deliberately
# the default; change to live only with explicit authorization and target scope.
project:
  name: lab.local
workflow_scope:
  domain: lab.local
  domain_controller: ""
  dns_server: ""
  targets: []
  targets_file: ""
  include_cidrs: []
  exclude_hosts: []
  exclude_cidrs: []
  max_targets: 4096
identity:
  kind: ""
  username: ""
  domain: ""
  password_env: ""
  password_file: ""
  certificate: ""
  private_key: ""
  kerberos_cache: ""
workflow:
  provider: mock
  discovery: true
  ldap: true
  authentication: false
  acknowledge_lockout_risk: false
  assessment: true
  reporting: true
safety:
  allow_authentication: false
  allow_content_download: false
  allow_client_registration: false
  allow_state_changes: false
  allow_remote_execution: false
output:
  directory: reports/lab_local
  html: true
  json: true
  secrets_file: false

# Offline fixture analysis only. Live policy collection is deliberately blocked.
policy:
  live_collection: false
  fixtures:
    enabled: false
    directories: []
  protocol:
    require_approved_live_contract: true
  parsing:
    enabled: true
  research:
    enabled: false
    research_set: ""
    verify_signatures: true
    require_known_signer: false
    derive_candidate_contract: false
    generate_dossier: false
  capture:
    accepted_formats: [har, pcap, pcapng, normalized_json]
    max_capture_bytes: 33554432
    max_packet_count: 250000
    max_stream_count: 2048
    max_per_stream_bytes: 4194304
    max_reassembled_body_bytes: 2097152
    max_decompressed_bytes: 8388608
    max_compression_ratio: 64
    max_xml_depth: 32
    max_json_depth: 32
    max_multipart_members: 64
    max_field_count: 512
    max_observed_string_length: 4096
    allowed_redacted_headers: [content-type, content-encoding, user-agent]
    ignored_headers: [authorization, cookie, set-cookie]
    sequence_timing_tolerance: 10ms
    minimum_samples: 2
    minimum_repetitions: 2
    signature_policy: warn_unsigned
    algorithm_version: capture-analysis-v1
# Capture kits use explicit CLI commands. Site, management-point, client,
# action, and environment fields are unverified operator metadata. No setting
# starts capture or enables live policy collection.
# Binary sanitization and research bundles are explicit CLI workflows. The safe
# default is metadata_only: opaque bodies remain unchanged and require review.
# No configuration key can set a protocol contract to approved_live.
secrets:
  enabled: false
  show_in_terminal: false
  output_file: reports/lab_local/secrets.txt
  format: text

scope:
  max_expanded_targets: 4096

discovery:
  ports: 53,80,88,135,389,443,445,636,1433,3268,3269,8530,8531,10123
  connect_timeout: 2s
  host_timeout: 30s
  concurrency: 32
  http_max_body_bytes: 32768
  http_max_redirects: 3
  user_agent: CinderPath-safe-discovery/dev

ldap:
  page_size: 500
  max_entries: 10000
  search_timeout: 30s

staleness:
  asset_days: 30
  evidence_days: 30
  certificate_warning_days: 30

auth_validation:
  enabled: false
  max_total_attempts: 3
  max_attempts_per_identity: 1
  max_attempts_per_endpoint: 1
  max_attempts_per_identity_endpoint: 1
  minimum_delay: 2s
  stop_after_success: true
  refuse_multiple_password_identities: true
  concurrency: 1
